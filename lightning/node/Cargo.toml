[package]
name = "menger-ln"
description = "Menger on Lightning: a balance that keeps its value in gold (1 Menger = 3.545 g), settled in bitcoin, self-custodial"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
menger-core = { path = "../core" }
# The development version of LDK Node 0.8, fixed at its state of 29 October 2026: built on LDK 0.3,
# where private channels accept payments as large as the channel. To be replaced by the 0.8 release.
ldk-node = { git = "https://github.com/lightningdevkit/ldk-node", rev = "79e4d92ae73c753dd64ee68ed8cb599cda8af8c7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "native-certs", "proxy-from-env", "socks-proxy"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
getrandom = "0.2"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3"
