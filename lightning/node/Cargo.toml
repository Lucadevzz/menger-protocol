[package]
name = "menger-ln"
description = "Menger on Lightning: a balance that keeps its value in gold (1 Menger = 3.545 g), settled in bitcoin, self-custodial"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
menger-core = { path = "../core" }
# The development version of LDK Node 0.8, fixed at its state of 10 November 2026: built on LDK 0.3
# (third release candidate), where private channels accept payments as large as the channel. To be
# replaced by the 0.8 release. The fourth candidate of LDK 0.3 (11 November 2026) fixes more, but
# its Esplora client does not compile yet: LDK Node will follow when it does.
ldk-node = { git = "https://github.com/lightningdevkit/ldk-node", rev = "92d703b04889bcd227a18abaf45b871cb28854db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "native-certs", "proxy-from-env", "socks-proxy"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
getrandom = "0.2"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3"
